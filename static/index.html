<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#fdf7f9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Personal Tavern</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body x-data="tavern()" x-init="boot()" @keydown.escape="panelOpen ? closePanel() : (menu && (menu = false))">

<!-- Icon sprite. Every glyph in the app is defined once here and used by
     reference, so the message tools, the action wheel and the menu cannot
     drift into three different drawing styles — and so none of them depend on
     which emoji font the phone happens to ship. All are stroked in
     currentColor and inherit whatever the palette sets. -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <g id="i-brain">
      <path d="M12 5.4A3 3 0 0 0 6.4 4 2.8 2.8 0 0 0 4 6.7a3 3 0 0 0-.4 5.2A3 3 0 0 0 5 17a3 3 0 0 0 4.4 2.4A2.6 2.6 0 0 0 12 21z"/>
      <path d="M12 5.4A3 3 0 0 1 17.6 4 2.8 2.8 0 0 1 20 6.7a3 3 0 0 1 .4 5.2A3 3 0 0 1 19 17a3 3 0 0 1-4.4 2.4A2.6 2.6 0 0 1 12 21z"/>
      <path d="M12 5.4V21"/>
    </g>
    <g id="i-theme">
      <circle cx="12" cy="12" r="8.4"/>
      <path d="M12 3.6a8.4 8.4 0 0 1 0 16.8z" fill="currentColor" stroke="none"/>
    </g>
    <g id="i-chats">
      <path d="M20.5 11.7c0 3.9-3.8 7-8.5 7-1 0-2-.15-2.9-.42L4 20l1.4-3.6a6.6 6.6 0 0 1-1.9-4.7c0-3.9 3.8-7 8.5-7s8.5 3.1 8.5 7z"/>
    </g>
    <g id="i-story">
      <path d="M12 6.6C10.4 5.3 8.3 4.6 5.6 4.6H3.5v13h2.1c2.7 0 4.8.7 6.4 2 1.6-1.3 3.7-2 6.4-2h2.1v-13h-2.1c-2.7 0-4.8.7-6.4 2z"/>
      <path d="M12 6.6v13"/>
    </g>
    <g id="i-menu">
      <path d="M4 7h16M4 12h16M4 17h16"/>
    </g>
    <g id="i-place">
      <path d="M12 21s6.5-5.7 6.5-10.2a6.5 6.5 0 0 0-13 0C5.5 15.3 12 21 12 21z"/>
      <circle cx="12" cy="10.6" r="2.4"/>
    </g>
    <g id="i-weather">
      <path d="M7.4 18.5h9.8a3.8 3.8 0 0 0 .5-7.6 5.6 5.6 0 0 0-10.8-1.2 3.9 3.9 0 0 0 .5 8.8z"/>
    </g>
    <g id="i-time">
      <circle cx="12" cy="12" r="8.4"/>
      <path d="M12 7.2V12l3.2 2"/>
    </g>
    <g id="i-refresh">
      <path d="M20 12a8 8 0 1 1-2.4-5.7"/>
      <path d="M20 4.2V9h-4.8"/>
    </g>
    <g id="i-edit">
      <path d="M4 20h4l10-10a2.6 2.6 0 0 0-3.7-3.7L4.3 16.3z"/>
      <path d="M14 6.6 17.4 10"/>
    </g>
    <g id="i-delete">
      <path d="M4.8 7h14.4"/>
      <path d="M9.4 7V5.2A1.2 1.2 0 0 1 10.6 4h2.8a1.2 1.2 0 0 1 1.2 1.2V7"/>
      <path d="M6.6 7l.9 12.1A1.9 1.9 0 0 0 9.4 21h5.2a1.9 1.9 0 0 0 1.9-1.9L17.4 7"/>
      <path d="M10.4 11v6M13.6 11v6"/>
    </g>
    <g id="i-copy">
      <rect x="9" y="9" width="11" height="11" rx="2.2"/>
      <path d="M15 6.2A2.2 2.2 0 0 0 12.8 4H6.2A2.2 2.2 0 0 0 4 6.2v6.6A2.2 2.2 0 0 0 6.2 15"/>
    </g>
    <g id="i-suggest">
      <path d="M6 18 18.4 5.6a2 2 0 0 0-2.8-2.8L3.2 15.2 2.4 19.4z"/>
      <path d="M19 14.4l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>
    </g>
    <g id="i-react">
      <circle cx="12" cy="12" r="8.4"/>
      <path d="M8.6 14.2a4.4 4.4 0 0 0 6.8 0"/>
      <path d="M9 9.6h.01M15 9.6h.01" stroke-width="2.4"/>
    </g>
    <g id="i-impersonate">
      <circle cx="9" cy="8.4" r="3.4"/>
      <path d="M3.4 19.6a5.6 5.6 0 0 1 11.2 0"/>
      <path d="M16.4 6.6h4.2M16.4 10.2h4.2M17.6 13.8h3"/>
    </g>
    <g id="i-send"><path d="M12 19.5V5M6 11 12 5l6 6"/></g>
    <g id="i-attach">
      <path d="M17.6 8.4 9.9 16a2.9 2.9 0 0 0 4.1 4.1l7.7-7.7a4.8 4.8 0 0 0-6.8-6.8L6.6 13a6.7 6.7 0 0 0 9.5 9.5"/>
    </g>
    <g id="i-import"><path d="M12 3.6v10.8M7.8 10.2 12 14.4l4.2-4.2"/><path d="M4.4 16.4v2.2a1.8 1.8 0 0 0 1.8 1.8h11.6a1.8 1.8 0 0 0 1.8-1.8v-2.2"/></g>
    <g id="i-export"><path d="M12 14.4V3.6M7.8 7.8 12 3.6l4.2 4.2"/><path d="M4.4 16.4v2.2a1.8 1.8 0 0 0 1.8 1.8h11.6a1.8 1.8 0 0 0 1.8-1.8v-2.2"/></g>
    <g id="i-eye">
      <path d="M2.2 12S5.8 5.6 12 5.6 21.8 12 21.8 12 18.2 18.4 12 18.4 2.2 12 2.2 12z"/>
      <circle cx="12" cy="12" r="3"/>
    </g>
    <g id="i-eye-off">
      <path d="M9.6 6.1A8.7 8.7 0 0 1 12 5.6c6.2 0 9.8 6.4 9.8 6.4a17 17 0 0 1-3 3.8"/>
      <path d="M6.4 7.7A17 17 0 0 0 2.2 12S5.8 18.4 12 18.4a8.9 8.9 0 0 0 3.4-.66"/>
      <path d="M4 4l16 16"/>
    </g>
    <g id="i-continue">
      <path d="M4 12h11"/><path d="M11 8l4 4-4 4"/>
      <path d="M19 5.5v13"/>
    </g>
    <g id="i-stop"><rect x="6.5" y="6.5" width="11" height="11" rx="2.4" fill="currentColor" stroke="none"/></g>
    <g id="i-star">
      <path d="M12 3.8l2.6 5.3 5.8.85-4.2 4.1 1 5.8L12 17.1l-5.2 2.75 1-5.8-4.2-4.1 5.8-.85z"/>
    </g>
    <g id="i-check"><path d="M4.8 12.6 9.6 17.4 19.2 6.6"/></g>
    <g id="i-close"><path d="M6 6l12 12M18 6 6 18"/></g>
    <g id="i-back"><path d="M14.6 5.4 8 12l6.6 6.6"/></g>
    <g id="i-plus"><path d="M12 5v14M5 12h14"/></g>
    <g id="i-scales">
      <path d="M12 4v16M7 20h10"/>
      <path d="M12 6.6 5 9M12 6.6 19 9"/>
      <path d="M2.6 14.4 5 9l2.4 5.4a2.6 2.6 0 0 1-4.8 0zM16.6 14.4 19 9l2.4 5.4a2.6 2.6 0 0 1-4.8 0z"/>
    </g>
    <!-- Stands in for a character with no portrait: a head and shoulders, so
         the roster stays a column of faces rather than a ragged list. -->
    <g id="i-person">
      <circle cx="12" cy="9" r="3.6"/>
      <path d="M4.8 20.4a7.4 7.4 0 0 1 14.4 0"/>
    </g>
  </defs>
</svg>

<!-- (1) pinned header: everything identifying the conversation on one line —
     the menu, who you are talking to, and where they are. The menu row opens
     underneath it. -->
<header class="worldbar">

  <div class="bar-row">
    <button class="icon-btn" :class="{ on: menu }" @click="menu = !menu"
            :aria-expanded="menu" aria-controls="main-menu"
            aria-label="Menu" title="Menu">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-menu"/></svg>
    </button>

    <!-- The name is the obvious thing to press when you want a different
         character, so it is the control that does that. -->
    <button class="who" @click="openCharacters()" :disabled="!character"
            :aria-label="character ? `${character.name} — characters and chats` : 'Characters'"
            x-text="character ? character.name : ''"></button>

    <!-- Hidden entirely until a scene exists. Three em-dashes said nothing
         except that the app had not got round to it yet. -->
    <div class="world-fields" x-show="hasScene" x-cloak>
      <span class="field" :class="{ refreshing: refreshing.scene }"
            :title="`Place: ${scene.place || 'unknown'}`" x-show="scene.place">
        <svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-place"/></svg>
        <span class="field-value" x-text="scene.place"></span>
      </span>
      <span class="field" :class="{ refreshing: refreshing.scene }"
            :title="`Weather: ${scene.weather || 'unknown'}`" x-show="scene.weather">
        <svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-weather"/></svg>
        <span class="field-value" x-text="scene.weather"></span>
      </span>
      <span class="field" :class="{ refreshing: refreshing.scene }"
            :title="`Time: ${scene.time || 'unknown'}`" x-show="scene.time">
        <svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-time"/></svg>
        <span class="field-value" x-text="scene.time"></span>
      </span>
    </div>

    <!-- The scene pass only fires when a reply suggests the setting moved.
         That is right nearly always, and wrong exactly when you are looking at
         a stale line and can see that it is stale. Before there is any line at
         all this is also the way to ask for one. -->
    <button class="icon-btn refresh" :class="{ spinning: refreshing.scene }"
            @click="refreshWorld()" :disabled="refreshing.scene || !chatId"
            :aria-label="hasScene ? 'Refresh world info' : 'Generate world info'"
            :title="hasScene ? 'Refresh world info' : 'Generate world info'">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-refresh"/></svg>
    </button>
  </div>

  <!-- The row of destinations. Collapsed to nothing until the menu opens; see
       the grid-rows note in styles.css for why it animates the way it does.
       It stays open once opened — picking a destination is usually the first
       of several, and collapsing it underneath the user each time made the
       header jump for no reason they asked for. -->
  <div class="menu-wrap" :class="{ open: menu }" id="main-menu">
    <div class="menu-clip">
      <nav class="menu-row">
        <button class="menu-btn" :class="{ on: panelOpen && panel === 'brain' }" @click="openPanel('brain')"
                aria-label="Model and engine" title="Model and engine">
          <svg class="menu-glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-brain"/></svg>
          <span class="menu-label">Brain</span>
        </button>
        <button class="menu-btn" :class="{ on: panelOpen && panel === 'theme' }" @click="openPanel('theme')"
                aria-label="Appearance" title="Appearance">
          <svg class="menu-glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-theme"/></svg>
          <span class="menu-label">Theme</span>
        </button>
        <button class="menu-btn" :class="{ on: panelOpen && panel === 'chats' }" @click="openPanel('chats')"
                aria-label="Characters and chats" title="Characters and chats">
          <svg class="menu-glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chats"/></svg>
          <span class="menu-label">Chats</span>
        </button>
        <button class="menu-btn" :class="{ on: panelOpen && panel === 'story' }" @click="openPanel('story')"
                aria-label="Story state" title="Story state">
          <svg class="menu-glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-story"/></svg>
          <span class="menu-label">Story</span>
        </button>
      </nav>
    </div>
  </div>
</header>

<!-- pass-status HUD (debug, toggleable) (§12) -->
<section class="hud" x-show="hud" x-cloak>
  <div class="hud-head">
    <span>Turn <b x-text="turn"></b></span>
    <span x-text="`${totals.tokens_in + totals.tokens_out} tokens this chat`"></span>
    <button class="link" @click="loadCost()">Cost ▾</button>
  </div>
  <template x-for="run in hudRuns" :key="run.id">
    <div class="hud-row" :class="'status-' + run.status">
      <span class="anim" :class="'anim-' + run.animation + ' status-' + run.status"></span>
      <span class="hud-pass" x-text="run.label"></span>
      <span class="hud-tier" x-text="run.tier"></span>
      <span class="hud-model" x-text="run.model || '—'"></span>
      <span class="hud-status" x-text="run.status"></span>
      <span class="hud-tok" x-text="`${run.tokens_in || 0}/${run.tokens_out || 0}`"></span>
      <span class="hud-err" x-show="run.error" x-text="run.error"></span>
    </div>
  </template>
  <div class="hud-empty" x-show="hudRuns.length === 0">No passes yet this turn</div>

  <div class="cost" x-show="cost.per_pass.length" x-cloak>
    <div class="cost-head">Spend per pass — proves the gating works</div>
    <template x-for="row in cost.per_pass" :key="row.pass_id">
      <div class="cost-row">
        <span x-text="row.pass_id"></span>
        <span class="bar"><i :style="`width:${costWidth(row)}%`"></i></span>
        <span class="cost-num" x-text="`${(row.tokens_in||0)+(row.tokens_out||0)} tok / ${row.runs} runs`"></span>
      </div>
    </template>
  </div>
</section>

<!-- (2) chat area (§12) -->
<main class="chat" x-ref="chat">
<!-- Everything that can change the chat's height lives in this one box, so a
     single ResizeObserver on it keeps the view pinned to the newest message —
     streaming tokens, the regen bubble animating, a portrait finishing
     loading, and anything added later, without each of them having to
     remember to scroll (see initScroll). -->
<div class="chat-inner" x-init="initScroll($el)">
  <template x-for="m in messages" :key="m.id">
    <article class="msg" :class="[m.role, sendingId === m.id ? 'sending' : '']">
      <img class="pfp" x-show="m.role === 'assistant' && portrait" :src="portrait" alt=""
           @error="$el.style.visibility = 'hidden'">
      <!-- Swipe the message itself to change variant: left forward, right back
           (§9). touch-action: pan-y leaves vertical scrolling to the chat. -->
      <div class="bubble" :data-mid="m.id"
           :class="{ swipeable: swipeable(m), dragging: dragId === m.id, hidden: m.hidden }"
           :style="dragId === m.id ? `transform: translateX(${dragDx}px)` : ''"
           @pointerdown="onMsgDown($event, m)"
           @pointermove="onMsgMove($event, m)"
           @pointerup="onMsgUp($event, m)"
           @pointercancel="onMsgCancel()"
           @contextmenu.prevent>
        <span class="swipe-hint" x-show="swipeHint(m)" x-text="swipeHint(m)" x-cloak></span>
        <!-- Said, but not remembered: it has to be obvious which messages the
             model can no longer see. -->
        <span class="hidden-mark" x-show="m.hidden" x-cloak title="Not in the prompt">
          <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-eye-off"/></svg>
        </span>

        <!-- Regenerating replaces this message in place: the bubble becomes the
             typing cue rather than a second bubble appearing underneath. -->
        <div class="body regen" x-show="isRegenerating(m)" x-cloak>
          <span class="anim anim-typing"><i></i><i></i><i></i></span>
        </div>
        <div class="body" :class="{ 'fade-out': fadingId === m.id }"
             x-effect="Markup.schedule($el, m.text)"
             x-show="editing !== m.id && !isRegenerating(m)"></div>
        <textarea class="edit-box" x-show="editing === m.id" x-model="editText"
                  :style="editHeight ? `min-height:${editHeight}px` : ''"
                  @input="autosize($event.target)" x-cloak></textarea>

        <!-- Both roles get tools now. There is no regenerate button: the
             right-arrow and the swipe gesture already do exactly that, and a
             third control for it was the odd one out. Everything else lives in
             the hold-to-open wheel; these are the two or three worth having
             one tap away. -->
        <div class="msg-tools" x-show="!streaming">
          <template x-if="editing !== m.id">
            <div class="tools-row">
              <button class="glyph-btn" @click="startEdit(m, $el)" title="Edit" aria-label="Edit">
                <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-edit"/></svg>
              </button>
              <button class="glyph-btn danger" :class="{ armed: confirmMsg === m.id }"
                      @click="deleteMessage(m)"
                      :title="confirmMsg === m.id ? 'Tap again to delete' : 'Delete'"
                      aria-label="Delete">
                <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-delete"/></svg>
              </button>
              <!-- Only on the newest reply, and there even at 1/1: the right
                   arrow past the last variant is what generates another, so
                   hiding these until a second variant exists would leave a
                   fresh reply with no way to be re-rolled but the swipe.
                   Older replies show their counter without the arrows, because
                   which variant they landed on is still worth knowing. -->
              <span class="variants" x-show="m.role === 'assistant'"
                    :class="{ frozen: !swipeable(m) }">
                <button class="glyph-btn" x-show="swipeable(m)" @click="goToVariant(m, -1)"
                        :disabled="(m.variant_index || 0) === 0"
                        title="Previous variant" aria-label="Previous variant">
                  <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-back"/></svg>
                </button>
                <span class="variant-count" x-show="m.variant_count > 1 || swipeable(m)"
                      x-text="`${(m.variant_index||0)+1}/${m.variant_count}`"></span>
                <button class="glyph-btn flip" x-show="swipeable(m)" @click="goToVariant(m, 1)"
                        title="Next variant" aria-label="Next variant">
                  <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-back"/></svg>
                </button>
              </span>
              <span class="edited" x-show="m.edited" title="Edited">
                <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-edit"/></svg>
              </span>
            </div>
          </template>
          <template x-if="editing === m.id">
            <div class="tools-row">
              <button class="glyph-btn ok" @click="saveEdit(m, false)"
                      title="Save" aria-label="Save">
                <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-check"/></svg>
              </button>
              <button class="glyph-btn" x-show="m.role === 'assistant'" @click="saveEdit(m, true)"
                      title="Save and re-run the state auditor" aria-label="Save and re-audit">
                <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-scales"/></svg>
              </button>
              <button class="glyph-btn danger" @click="cancelEdit()"
                      title="Discard changes" aria-label="Discard changes">
                <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-close"/></svg>
              </button>
            </div>
          </template>
        </div>
      </div>
    </article>
  </template>

  <!-- composing animation: "typing…" for pass 1, cogs for other blocking passes -->
  <!-- Only for a brand-new reply. Regenerating shows the cue inside the
       existing bubble instead, so nothing appears underneath it. -->
  <article class="msg assistant" x-show="composing && !regenId" x-cloak>
    <img class="pfp" x-show="portrait" :src="portrait" alt="">
    <div class="bubble composing">
      <span class="anim anim-typing" x-show="composingKind === 'typing'"><i></i><i></i><i></i></span>
      <span class="anim anim-cogs" x-show="composingKind !== 'typing'"></span>
      <span class="composing-label" x-text="composingLabel"></span>
    </div>
  </article>

  <div class="banner error" x-show="error" x-cloak>
    <span x-text="error"></span>
    <button class="link" @click="error = ''">Dismiss</button>
  </div>
</div>
</main>

<!-- Hold a message to open this. Two ways to choose, and the wheel does not
     have to guess which one is happening: keep holding and slide onto an
     option, or let go where you are and the names appear for tapping. -->
<div class="wheel-layer" x-show="wheel" x-cloak
     @pointerup.self="closeWheel()" @click.self="closeWheel()">
  <template x-if="wheel">
    <div class="wheel" :class="{ released: wheel.released, settled: wheelSettled }"
         :style="`left:${wheel.cx}px; top:${wheel.cy}px`">
      <span class="wheel-hub" :class="{ dimmed: wheel.active >= 0 }"></span>
      <template x-for="(o, i) in wheel.options" :key="o.id">
        <button class="wheel-opt"
                :class="{ active: wheel.active === i, danger: o.danger, soon: o.soon }"
                :style="`--dx:${o.dx}px; --dy:${o.dy}px; --i:${i}`"
                @click="pickWheel(o)" :aria-label="o.label" :title="o.label">
          <span class="wheel-disc">
            <svg class="wheel-glyph" viewBox="0 0 24 24" aria-hidden="true"><use :href="o.icon"/></svg>
          </span>
          <span class="wheel-label" x-text="o.label"></span>
        </button>
      </template>
    </div>
  </template>
</div>

<!-- One line of feedback for things with no other visible result. -->
<div class="hint-toast" x-show="wheelHint" x-cloak x-text="wheelHint"
     x-transition:enter="hint-enter" x-transition:enter-start="hint-from"
     x-transition:enter-end="hint-to"
     x-transition:leave="hint-leave" x-transition:leave-start="hint-to"
     x-transition:leave-end="hint-from"></div>

<!-- ambient indicator: a background pass is working, no character-thinking cue -->
<div class="ambient" x-show="ambient.length" x-cloak>
  <template x-for="a in ambient" :key="a">
    <span class="ambient-chip" x-text="a"></span>
  </template>
</div>

<!-- Pulling up past the newest message reveals this, in proportion to how far
     you pull. Impersonate is the thing you want exactly when you are at the
     bottom with nothing to say, which is the position this gesture starts
     from. -->
<div class="reveal" :class="{ armed: revealArmed }"
     :style="`--reveal:${reveal}`" x-show="reveal > 0.02" x-cloak>
  <button class="reveal-btn" @click="impersonate()" :disabled="streaming">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-impersonate"/></svg>
    <span x-text="revealArmed ? 'Release to write for me' : 'Keep pulling to write for me'"></span>
  </button>
</div>

<!-- (4) composer -->
<footer class="composer">
  <button class="icon-btn composer-more" :class="{ on: composerMenu }"
          @click="composerMenu = !composerMenu" :aria-expanded="composerMenu"
          aria-label="More actions" title="More actions">
    <svg class="icon" viewBox="0 0 24 24"><use href="#i-plus"/></svg>
  </button>
  <textarea x-model="draft" rows="1" placeholder="Say something…"
            @keydown.enter.prevent="if (!$event.shiftKey) send()"
            @input="autosize($event.target)" x-ref="input"></textarea>
  <!-- The same button in two states, not two buttons: while a reply is coming
       the only thing you can usefully do with that corner is call it off, and a
       control that swaps its meaning under the thumb is easier to hit than one
       that appears somewhere else. -->
  <button class="send" :class="{ stop: streaming }"
          @click="streaming ? stopGenerating() : send()"
          :disabled="!streaming && !draft.trim()"
          :aria-label="streaming ? 'Stop generating' : 'Send'"
          :title="streaming ? 'Stop generating' : 'Send'">
    <svg class="icon" viewBox="0 0 24 24" x-show="!streaming"><use href="#i-send"/></svg>
    <svg class="icon" viewBox="0 0 24 24" x-show="streaming" x-cloak><use href="#i-stop"/></svg>
  </button>
</footer>

<!-- The composer's own menu. Rises from the composer rather than dropping from
     the top, because that is where the button is and where the eye already is. -->
<!-- Any tap outside an option closes it, including on the text box, which is
     the obvious place to reach for when you have changed your mind. `.self`
     was not enough: the menu's own bottom padding is what sits over the
     composer, so a tap there landed on the padding rather than on the scrim. -->
<div class="composer-sheet" x-show="composerMenu" x-cloak
     @click="composerMenu = false">
  <div class="composer-menu">
    <template x-for="(a, i) in composerActions()" :key="a.id">
      <button class="composer-item" :class="{ soon: a.soon }" :style="`--i:${i}`"
              @click="runComposerAction(a)" :disabled="a.disabled">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use :href="a.icon"/></svg>
        <span class="composer-item-name" x-text="a.label"></span>
        <span class="composer-item-note" x-text="a.note || ''"></span>
      </button>
    </template>
  </div>
</div>

<!-- Every destination in the menu opens the same sheet with a different body.
     One sheet rather than four: they share the head, the scroll behaviour and
     the safe-area padding, and only ever one is on screen. -->
<section class="sheet" x-show="panelOpen" x-cloak
         x-transition:enter="sheet-enter" x-transition:enter-start="sheet-from"
         x-transition:enter-end="sheet-to"
         x-transition:leave="sheet-leave" x-transition:leave-start="sheet-to"
         x-transition:leave-end="sheet-from">
  <header class="sheet-head">
    <button class="icon-btn" x-show="panel === 'character' || panel === 'persona'"
            @click="panel = 'chats'" aria-label="Back">
      <svg class="icon" viewBox="0 0 24 24"><use href="#i-back"/></svg>
    </button>
    <h2 x-text="panelTitle()"></h2>
    <button class="icon-btn" @click="closePanel()" aria-label="Close">✕</button>
  </header>

  <div class="sheet-body">

    <!-- ----------------------------------------------------------- brain -->
    <template x-if="panel === 'brain'">
      <div>
        <p class="note">
          Keys are stored in <code x-text="settings.path"></code> on this phone only.
          That file is gitignored and written owner-readable. Saved keys are never sent
          back to this page — a field showing <code>•••</code> already has one.
        </p>

        <h3>Tiers</h3>
        <p class="note">Assign by latency tolerance, not importance. Never point
          <em>background</em> at an on-device model — those passes must survive the
          screen going off.</p>
        <template x-for="tier in settings.tier_names" :key="tier">
          <label class="row">
            <span class="row-label" x-text="tier"></span>
            <select x-model="settings.tiers[tier]">
              <template x-for="b in settings.backends" :key="b.name">
                <option :value="b.name" x-text="b.name"></option>
              </template>
            </select>
          </label>
        </template>

        <h3>Backends</h3>
        <template x-for="(b, i) in settings.backends" :key="i">
          <div class="backend">
            <div class="backend-head">
              <!-- Not x-model: the rename has to see the old name to move the
                   tiers that point at it, and x-model would have overwritten
                   it first. -->
              <input class="grow" :value="b.name" @input="renameBackend(b, $event.target.value)"
                     placeholder="Name" aria-label="Backend name">
              <select x-model="b.kind" @change="onKindChange(b)">
                <template x-for="k in settings.kinds" :key="k">
                  <option :value="k" x-text="k"></option>
                </template>
              </select>
              <button class="link danger" @click="removeBackend(i)"
                      :disabled="settings.backends.length < 2">Remove</button>
            </div>

            <p class="kind-note" x-show="kindNote(b.kind)" x-text="kindNote(b.kind)"></p>

            <label class="row"><span class="row-label">Model</span>
              <!-- datalist, not select: the options are what the backend reports,
                   but a model you are about to pull must still be typeable. -->
              <input x-model="b.model" :list="`models-${i}`" placeholder="llama3.1:8b"
                     autocomplete="off" spellcheck="false">
              <datalist :id="`models-${i}`">
                <template x-for="m in (models[b.name] || [])" :key="m">
                  <option :value="m"></option>
                </template>
              </datalist>
              <button class="link" @click.prevent="loadModels(b)" :disabled="loadingModels === b.name">
                <span x-text="loadingModels === b.name ? '…' : 'Load'"></span>
              </button>
            </label>
            <p class="kind-note" x-show="modelHint(b.name)" x-text="modelHint(b.name)"></p>
            <label class="row" x-show="b.kind !== 'echo'"><span class="row-label">URL</span>
              <input x-model="b.base_url" placeholder="http://100.x.y.z:11434" inputmode="url"></label>
            <label class="row" x-show="b.kind === 'openai' || b.kind === 'horde'">
              <span class="row-label">Key</span>
              <input type="password" x-model="b.api_key" autocomplete="off"
                     spellcheck="false" :placeholder="b.kind === 'horde' ? '0000000000 for anonymous' : 'API key'">
            </label>
            <label class="row"><span class="row-label">Template</span>
              <select x-model="b.template">
                <template x-for="t in settings.templates" :key="t">
                  <option :value="t" x-text="t"></option>
                </template>
              </select>
            </label>
            <label class="col-field">
              <span class="row-label wide-label">Stop at</span>
              <textarea rows="2" :value="(b.stop || []).join('\n')"
                        @input="b.stop = $event.target.value.split('\n')"
                        placeholder="One per line. Left empty, only the template's own are used."></textarea>
              <span class="kind-note">Sequences that end a generation — a label
                this model keeps writing, a scene break it overuses.</span>
            </label>

            <div class="backend-foot">
              <button class="link" @click="testBackend(b)" :disabled="testing === b.name">
                <span x-text="testing === b.name ? 'Testing…' : 'Test connection'"></span>
              </button>
              <span class="test-result" :class="{ ok: (tests[b.name]||{}).ok, bad: tests[b.name] && !tests[b.name].ok }"
                    x-show="tests[b.name]" x-text="testLabel(b.name)"></span>
            </div>
          </div>
        </template>

        <button class="wide" @click="addBackend()">Add backend</button>

        <h3>Context</h3>
        <p class="note">
          How much of the conversation reaches the model. Messages are only
          dropped once the summary <em>and</em> the memory pass have covered
          them, so nothing is lost by lowering these.
        </p>
        <template x-for="n in numberFields('basic')" :key="n.key">
          <div class="num-field">
            <div class="num-head">
              <span class="num-label" x-text="n.label"></span>
              <input class="num-box" type="number" :min="n.min" :step="n.step || 1"
                     :value="settings[n.key]" @input="setNumber(n, $event.target.value)"
                     :aria-label="n.label">
              <span class="num-unit" x-text="n.unit || ''"></span>
            </div>
            <input class="num-slider" type="range" :min="n.min" :max="n.max" :step="n.step || 1"
                   :value="Math.min(n.max, Math.max(n.min, settings[n.key]))"
                   @input="setNumber(n, $event.target.value)" :aria-label="n.label">
            <p class="kind-note" x-text="n.note"></p>
          </div>
        </template>

        <!-- Everything below is right at its default until there is a specific
             reason it is not, so it is one tap away rather than in the way. -->
        <button class="disclose" :class="{ open: showAdvancedBrain }"
                @click="showAdvancedBrain = !showAdvancedBrain"
                :aria-expanded="showAdvancedBrain">
          <svg class="disclose-arrow" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back"/></svg>
          <span>Advanced</span>
        </button>
        <div class="fold" :class="{ open: showAdvancedBrain }">
          <div class="fold-clip">
            <template x-for="n in numberFields('advanced')" :key="n.key">
              <div class="num-field">
                <div class="num-head">
                  <span class="num-label" x-text="n.label"></span>
                  <input class="num-box" type="number" :min="n.min" :step="n.step || 1"
                         :value="settings[n.key]" @input="setNumber(n, $event.target.value)"
                         :aria-label="n.label">
                  <span class="num-unit" x-text="n.unit || ''"></span>
                </div>
                <input class="num-slider" type="range" :min="n.min" :max="n.max" :step="n.step || 1"
                       :value="Math.min(n.max, Math.max(n.min, settings[n.key]))"
                       @input="setNumber(n, $event.target.value)" :aria-label="n.label">
                <p class="kind-note" x-text="n.note"></p>
              </div>
            </template>

            <h3>Sampling</h3>
            <p class="note">
              Per pass. The reply is the one you can hear; the rest are cheap on
              purpose, and turning them up costs tokens every turn. Saved as you
              change them.
            </p>
            <template x-for="p in passes" :key="p.id">
              <div class="pass-row">
                <div class="pass-head">
                  <span class="pass-name" x-text="p.label || p.id"></span>
                  <span class="pass-tier" x-text="p.model_tier"></span>
                </div>
                <template x-for="f in samplingFields()" :key="f.key">
                  <div class="num-field">
                    <div class="num-head">
                      <span class="num-label" x-text="f.label"></span>
                      <input class="num-box" type="number" :min="f.min" :step="f.step"
                             :value="p.sampling[f.key]"
                             @input="setSampling(p, f, $event.target.value)"
                             :aria-label="`${p.label || p.id} ${f.label}`">
                    </div>
                    <input class="num-slider" type="range" :min="f.min" :max="f.max" :step="f.step"
                           :value="Math.min(f.max, Math.max(f.min, p.sampling[f.key]))"
                           @input="setSampling(p, f, $event.target.value)"
                           :aria-label="`${p.label || p.id} ${f.label}`">
                  </div>
                </template>
              </div>
            </template>
            <span class="save-msg" x-text="passMsg"></span>
          </div>
        </div>

        <div class="sheet-actions">
          <button class="wide primary" @click="saveSettings()" :disabled="saving">
            <span x-text="saving ? 'Saving…' : 'Save'"></span>
          </button>
          <span class="save-msg" :class="{ bad: saveError }" x-text="saveError || saveMsg"></span>
        </div>
      </div>
    </template>

    <!-- ----------------------------------------------------------- theme -->
    <template x-if="panel === 'theme'">
      <div>
        <p class="note">Everything here previews live. Save keeps it.</p>

        <h3>Backdrop</h3>
        <!-- Pictures, not a dropdown of filenames: the thing being chosen is
             an image, and a name in a list says nothing about how it looks
             behind text. -->
        <div class="bg-grid">
          <button class="bg-tile" :class="{ on: settings.background === 'none' }"
                  @click="setBackground('none')" aria-label="No backdrop">
            <span class="bg-none">None</span>
          </button>
          <template x-for="b in backdrops" :key="b.name">
            <button class="bg-tile" :class="{ on: settings.background === b.name }"
                    @click="setBackground(b.name)" :aria-label="b.name"
                    :style="`background-image:url('${b.url}')`">
              <span class="bg-name" x-text="b.name.replace(/\.[^.]+$/, '')"></span>
              <span class="bg-del" x-show="b.removable" :class="{ armed: confirmBg === b.name }"
                    @click.stop="deleteBackdrop(b)"
                    :title="confirmBg === b.name ? 'Tap again to delete' : 'Delete'">
                <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-close"/></svg>
              </span>
            </button>
          </template>
        </div>

        <label class="wide file-btn">
          <input type="file" accept="image/*" @change="uploadBackdrop($event)" hidden>
          <span x-text="uploadingBg ? 'Uploading…' : 'Add an image'"></span>
        </label>
        <p class="kind-note" x-text="bgMsg"></p>

        <div class="num-field" x-show="settings.background !== 'none'">
          <div class="num-head">
            <span class="num-label">Backdrop fade</span>
            <span class="num-unit" x-text="`${settings.background_dim}%`"></span>
          </div>
          <input class="num-slider" type="range" min="40" max="100" :value="settings.background_dim"
                 @input="setBackgroundDim($event.target.value)" aria-label="Backdrop fade">
          <p class="kind-note">Higher washes the image out further behind the text.</p>
        </div>

        <h3>Colour</h3>
        <div class="preset-row">
          <template x-for="preset in themePresets()" :key="preset.id">
            <button class="preset" @click="applyPreset(preset)" :aria-label="preset.label">
              <span class="preset-swatch" :style="preset.swatch"></span>
              <span x-text="preset.label"></span>
            </button>
          </template>
        </div>

        <label class="row theme-row">
          <span class="row-label wide-label">Accent</span>
          <input type="color" :value="themeValue(accentToken())"
                 @input="setTheme(accentToken(), $event.target.value)">
          <span class="theme-value" x-text="themeValue(accentToken())"></span>
        </label>

        <!-- Eighteen colour pickers is a paint program, not a setting. The
             presets and the accent cover what anyone actually changes. -->
        <button class="disclose" :class="{ open: showAdvancedTheme }"
                @click="showAdvancedTheme = !showAdvancedTheme"
                :aria-expanded="showAdvancedTheme">
          <svg class="disclose-arrow" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back"/></svg>
          <span>Advanced — every colour and size</span>
        </button>
        <div class="fold" :class="{ open: showAdvancedTheme }">
          <div class="fold-clip">
            <template x-for="group in themeGroups()" :key="group">
              <div class="theme-group">
                <div class="theme-group-name" x-text="group"></div>
                <template x-for="token in themeIn(group)" :key="token.var">
                  <label class="row theme-row">
                    <span class="row-label wide-label" x-text="token.label"></span>
                    <template x-if="token.type === 'color'">
                      <input type="color" :value="themeValue(token)"
                             @input="setTheme(token, $event.target.value)">
                    </template>
                    <template x-if="token.type !== 'color'">
                      <input type="range" :min="token.type === 'pct' ? 40 : 0"
                             :max="token.type === 'pct' ? 100 : 30"
                             :value="parseInt(themeValue(token))"
                             @input="setTheme(token, $event.target.value + (token.type === 'pct' ? '%' : 'px'))">
                    </template>
                    <span class="theme-value" x-text="themeValue(token)"></span>
                  </label>
                </template>
              </div>
            </template>
          </div>
        </div>

        <button class="wide" @click="resetTheme()">Reset appearance to defaults</button>

        <div class="sheet-actions">
          <button class="wide primary" @click="saveSettings()" :disabled="saving">
            <span x-text="saving ? 'Saving…' : 'Save'"></span>
          </button>
          <span class="save-msg" :class="{ bad: saveError }" x-text="saveError || saveMsg"></span>
        </div>
      </div>
    </template>

    <!-- ----------------------------------------------------------- chats -->
    <template x-if="panel === 'chats'">
      <div>
        <!-- Who you are comes first: it is the shorter list, it changes less
             often, and every character below is talked to as this person. -->
        <h3>You</h3>
        <p class="note" x-show="!personas.length">
          Nobody set up yet, so the character calls you "You". Add a persona and
          <code>{{user}}</code> becomes your name.
        </p>
        <template x-for="pn in personas" :key="pn.id">
          <div class="persona" :class="{ current: (persona || {}).id === pn.id }"
               @click="usePersona(pn)">
            <span class="char-pfp">
              <svg class="char-pfp-generic" viewBox="0 0 24 24" aria-hidden="true">
                <use href="#i-person"/>
              </svg>
              <img x-show="pn.avatar" :src="`/avatars/${pn.avatar}`" alt=""
                   @error="$el.style.display = 'none'">
            </span>
            <div class="char-id">
              <span class="char-name" x-text="pn.name"></span>
              <span class="char-meta" x-text="pn.description || 'No description'"></span>
            </div>
            <button class="glyph-btn" :class="{ on: pn.is_default }"
                    @click.stop="makeDefaultPersona(pn)"
                    :title="pn.is_default ? 'Used by new chats' : 'Use for new chats'"
                    aria-label="Default persona">
              <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-star"/></svg>
            </button>
            <button class="glyph-btn" @click.stop="editPersona(pn)"
                    title="Edit persona" aria-label="Edit persona">
              <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-edit"/></svg>
            </button>
            <button class="glyph-btn danger" :class="{ armed: confirmPersona === pn.id }"
                    @click.stop="deletePersona(pn)"
                    :title="confirmPersona === pn.id ? 'Tap again to delete' : 'Delete persona'"
                    aria-label="Delete persona">
              <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-close"/></svg>
            </button>
          </div>
        </template>
        <button class="wide" @click="newPersona()">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>
          <span>New persona</span>
        </button>

        <h3>Characters</h3>
        <p class="note">
          One row per character. Deleting a character deletes its chats with it —
          that is why it asks twice.
        </p>

        <template x-for="c in characters" :key="c.id">
          <div class="char" :class="{ current: c.id === characterId }">
            <div class="char-head">
              <!-- Every row gets a portrait slot, filled or not: a card can
                   name an image that was never copied in, and a character
                   written here has none at all. The fallback sits underneath
                   and the photo covers it when there is one, so a broken image
                   reveals the placeholder instead of leaving a hole. -->
              <span class="char-pfp">
                <svg class="char-pfp-generic" viewBox="0 0 24 24" aria-hidden="true">
                  <use href="#i-person"/>
                </svg>
                <img x-show="c.pfp" :src="`/static/characters/${c.pfp}`" alt=""
                     @error="$el.style.display = 'none'">
              </span>
              <div class="char-id">
                <span class="char-name" x-text="c.name"></span>
                <span class="char-meta" x-text="`${c.chats} chat${c.chats === 1 ? '' : 's'}`"></span>
              </div>
              <button class="glyph-btn" @click="editCharacter(c.id)"
                      title="Edit character" aria-label="Edit character">
                <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-edit"/></svg>
              </button>
              <a class="glyph-btn" :href="`/api/characters/${c.id}/export?download=true`"
                 :download="`${c.name}.card.json`"
                 title="Export card" aria-label="Export card">
                <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-export"/></svg>
              </a>
              <button class="glyph-btn" @click="newChat(c.id)"
                      title="New chat" aria-label="New chat">
                <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-plus"/></svg>
              </button>
              <button class="glyph-btn" :class="{ on: historyFor === c.id }"
                      @click="toggleHistory(c.id)"
                      title="Chat history" aria-label="Chat history">
                <svg class="icon-btn-glyph" viewBox="0 0 24 24"><use href="#i-menu"/></svg>
              </button>
              <button class="glyph-btn danger" :class="{ armed: confirmChar === c.id }"
                      @click="deleteCharacter(c)"
                      :title="confirmChar === c.id ? 'Tap again to delete — this deletes its chats too' : 'Delete character'"
                      aria-label="Delete character"
                      x-text="confirmChar === c.id ? '⚠&#xFE0E;' : '✕&#xFE0E;'"></button>
            </div>

            <ul class="chat-list" x-show="historyFor === c.id" x-cloak>
              <template x-for="chat in chatsFor(c.id)" :key="chat.id">
                <li :class="{ active: chat.id === chatId }">
                  <button class="chat-open" @click="openChat(chat.id); closePanel()">
                    <span class="chat-title" x-text="chat.title || 'untitled'"></span>
                    <span class="chat-when" x-text="whenLabel(chat)"></span>
                  </button>
                  <button class="glyph-btn danger" :class="{ armed: confirmChat === chat.id }"
                          @click="deleteChat(chat)"
                          :title="confirmChat === chat.id ? 'Tap again to delete' : 'Delete chat'"
                          aria-label="Delete chat"
                          x-text="confirmChat === chat.id ? '⚠&#xFE0E;' : '✕&#xFE0E;'"></button>
                </li>
              </template>
              <li class="chat-empty" x-show="!chatsFor(c.id).length">No chats yet</li>
            </ul>
          </div>
        </template>

        <div class="btn-row">
          <button class="wide" @click="newCharacter()">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-plus"/></svg>
            <span>New character</span>
          </button>
          <label class="wide file-btn">
            <input type="file" accept=".json,.png,image/png,application/json"
                   @change="importCard($event)" hidden>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-import"/></svg>
            <span x-text="importing ? 'Importing…' : 'Import card'"></span>
          </label>
        </div>
        <p class="kind-note" :class="{ bad: importError }" x-text="importError || importMsg"></p>
        <p class="note">
          Cards are the SillyTavern format — a <code>.json</code> or a
          <code>.png</code> with the character inside it. Export writes one back
          out that SillyTavern and the rest will read.
        </p>
      </div>
    </template>

    <!-- ------------------------------------------------------- character -->
    <template x-if="panel === 'character'">
      <div>
        <p class="note" x-show="draftCharacter.id">
          Portraits, backgrounds, lorebook and state schema come from the card and
          are kept as they are — editing here only rewrites the text below.
        </p>
        <label class="row col-row"><span class="row-label wide-label">Name</span>
          <input x-model="draftCharacter.name" placeholder="Name"></label>
        <label class="col-field"><span class="row-label wide-label">Persona</span>
          <textarea x-model="draftCharacter.persona" rows="6"
                    placeholder="Who they are, how they speak, what they want."></textarea></label>
        <label class="col-field"><span class="row-label wide-label">Greeting</span>
          <textarea x-model="draftCharacter.first_mes" rows="4"
                    placeholder="The first message, sent when a chat opens."></textarea></label>
        <label class="col-field">
          <span class="row-label wide-label">Other greetings</span>
          <textarea x-model="altGreetings" rows="4"
                    placeholder="One per paragraph. Swipe the opening message to choose between them."></textarea>
          <span class="kind-note">Separate them with a blank line. A new chat opens on
            the first greeting; the rest are swipes on it.</span>
        </label>
        <label class="col-field"><span class="row-label wide-label">Scenario</span>
          <textarea x-model="draftCharacter.scenario" rows="3"
                    placeholder="Where this is happening."></textarea></label>
        <label class="col-field"><span class="row-label wide-label">Example dialogue</span>
          <textarea x-model="draftCharacter.example_dialogue" rows="4"
                    placeholder="A short exchange showing their voice."></textarea></label>
        <label class="col-field"><span class="row-label wide-label">System prompt</span>
          <textarea x-model="draftCharacter.system_prompt" rows="3"
                    placeholder="Extra instructions, prepended to every reply pass."></textarea></label>
        <label class="col-field">
          <span class="row-label wide-label">Stop at</span>
          <textarea x-model="stopStrings" rows="2"
                    placeholder="One per line. Sequences that end this character's replies."></textarea>
        </label>
        <label class="col-field">
          <span class="row-label wide-label">Final instruction</span>
          <textarea x-model="draftCharacter.post_history_instructions" rows="3"
                    placeholder="Read after the conversation, so it wins over anything the scene has drifted into."></textarea>
        </label>

        <div class="sheet-actions">
          <button class="wide primary" @click="saveCharacter()" :disabled="savingCharacter">
            <span x-text="savingCharacter ? 'Saving…' : 'Save character'"></span>
          </button>
          <span class="save-msg" :class="{ bad: charError }" x-text="charError || charMsg"></span>
        </div>
      </div>
    </template>

    <!-- --------------------------------------------------------- persona -->
    <template x-if="panel === 'persona'">
      <div>
        <p class="note">
          This is who the character is talking to. The name replaces
          <code>{{user}}</code>; the description is given to the model the same
          way the character's own is.
        </p>
        <label class="row col-row"><span class="row-label wide-label">Name</span>
          <input x-model="draftPersona.name" placeholder="Your name in the story"></label>
        <label class="col-field"><span class="row-label wide-label">About you</span>
          <textarea x-model="draftPersona.description" rows="6"
                    placeholder="What the character knows about you. Left blank, only the name is used."></textarea></label>

        <div class="row col-row">
          <span class="row-label wide-label">Portrait</span>
          <span class="char-pfp big">
            <svg class="char-pfp-generic" viewBox="0 0 24 24" aria-hidden="true">
              <use href="#i-person"/>
            </svg>
            <img x-show="draftPersona.avatar" :src="`/avatars/${draftPersona.avatar}`" alt=""
                 @error="$el.style.display = 'none'">
          </span>
          <label class="wide file-btn">
            <input type="file" accept="image/*" @change="uploadAvatar($event)" hidden>
            <span x-text="uploadingAvatar ? 'Uploading…' : 'Choose an image'"></span>
          </label>
        </div>

        <label class="toggle">
          <input type="checkbox" x-model="draftPersona.is_default">
          <span>Use this persona for new chats</span>
        </label>

        <div class="sheet-actions">
          <button class="wide primary" @click="savePersona()" :disabled="savingPersona">
            <span x-text="savingPersona ? 'Saving…' : 'Save persona'"></span>
          </button>
          <span class="save-msg" :class="{ bad: personaError }" x-text="personaError || personaMsg"></span>
        </div>
      </div>
    </template>

    <!-- ----------------------------------------------------------- story -->
    <template x-if="panel === 'story'">
      <div>
        <!-- A standing instruction, placed inside the recent conversation
             rather than at the top of the prompt. It is here rather than in
             settings because it is about *this story*, and it is the first
             thing in the panel because it is the one thing here you write
             rather than read. -->
        <h3>Author's note</h3>
        <p class="note">
          A standing instruction, slipped into the conversation near the end so
          it stays in view. Use it to steer — <em>keep the pace slow</em>,
          <em>she is hiding something</em> — not to describe the character.
        </p>
        <label class="col-field">
          <textarea x-model="note.text" rows="3" @change="saveNote()"
                    placeholder="Left empty, nothing is added."></textarea>
        </label>
        <div class="num-field">
          <div class="num-head">
            <span class="num-label">How far back</span>
            <span class="num-unit" x-text="note.depth === 0 ? 'at the end' :
              `${note.depth} message${note.depth === 1 ? '' : 's'} back`"></span>
          </div>
          <input class="num-slider" type="range" min="0" max="8" :value="note.depth"
                 @input="note.depth = +$event.target.value" @change="saveNote()"
                 aria-label="How far back">
          <p class="kind-note">
            At the end it carries most weight and costs least. Further back it
            reads as a standing condition rather than as something just said —
            but everything after it has to be re-read by the model each turn.
          </p>
        </div>
        <div class="num-field">
          <div class="num-head">
            <span class="num-label">How often</span>
            <span class="num-unit" x-text="note.frequency === 1 ? 'every turn' :
              `every ${note.frequency} turns`"></span>
          </div>
          <input class="num-slider" type="range" min="1" max="6" :value="note.frequency"
                 @input="note.frequency = +$event.target.value" @change="saveNote()"
                 aria-label="How often">
        </div>
        <p class="kind-note" x-show="noteMsg" x-text="noteMsg"></p>
        <p class="kind-note" x-show="!noteFromChat && note.text">
          This one comes from the character card. Editing it here makes it this
          chat's own.
        </p>

        <h3>State</h3>
        <div class="bands">
          <template x-for="b in bands" :key="b.variable">
            <div class="band">
              <span class="band-var" x-text="b.variable"></span>
              <span class="band-label" x-text="b.band"></span>
              <span class="band-guide" x-text="b.guidance"></span>
            </div>
          </template>
          <div class="provisional" x-show="stateProvisional">Provisional — auditor pending</div>
        </div>

        <h3>Toggles</h3>
        <template x-for="t in toggles" :key="t.id">
          <label class="toggle">
            <input type="checkbox" :checked="toggleStates[t.id]" @change="setToggle(t.id, $event.target.checked)">
            <span x-text="t.label"></span>
          </label>
        </template>

        <h3>Summary</h3>
        <p class="summary" x-text="summary.text || 'Nothing summarised yet'"></p>

        <h3>Debug</h3>
        <label class="toggle">
          <input type="checkbox" x-model="hud">
          <span>Pass HUD and cost</span>
        </label>
      </div>
    </template>

  </div>
</section>

<script src="/static/markup.js"></script>
<script src="/static/app.js"></script>
<script defer src="/static/vendor/alpine.min.js"></script>
</body>
</html>
